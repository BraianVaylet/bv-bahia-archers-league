# Integración continua.
#
# Los cuatro jobs de `docs/CONFIG.md` §8. Bloquean el merge.
#
# Existe porque tres bugs llegaron a `main` sin que nada los frenara: el lint
# roto desde `FE-3`, la PWA construyéndose sin hoja de estilos, y la
# sincronización sin enchufar. Ver `docs/BITACORA.md`.

name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Los tests de integración levantan MongoDB en memoria; sin esto cada job se
  # baja el binario de nuevo.
  MONGOMS_VERSION: 7.0.14

jobs:
  quality:
    name: Lint, tipos y tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Caché del binario de MongoDB
        uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongo-${{ runner.os }}-${{ env.MONGOMS_VERSION }}

      # Una sola descarga, antes de los tests. Vitest corre los archivos en
      # paralelo y todos los workers levantan su propio replica set: en una
      # máquina limpia se pisan bajando el mismo binario.
      - name: Precargar MongoDB
        run: node scripts/precargar-mongo.mjs

      # Los scripts de la raíz nombran paquete por paquete. `@bal/ui` quedó fuera
      # de esa lista dos veces seguidas, así que ahora lo mira alguien más.
      - name: Coherencia del workspace
        run: node scripts/verificar-workspace.mjs

      # `biome check` incluye formato y lint. Falla si algo no está formateado.
      - name: Lint
        run: pnpm lint

      - name: Tipos
        run: pnpm typecheck

      - name: Tests
        run: pnpm test

  budget:
    name: Presupuestos de bundle
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      # Verifica el tamaño Y que cada frontend emita su hoja de estilos.
      - name: Presupuestos
        run: node scripts/presupuesto.mjs

  e2e:
    name: E2E con tramo offline
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Caché del binario de MongoDB
        uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongo-${{ runner.os }}-${{ env.MONGOMS_VERSION }}

      # El navegador pesa y no cambia salvo que cambie la versión de Playwright,
      # que está clavada en el lockfile.
      - name: Caché del navegador de Playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      # `--with-deps` dispara un `apt-get` contra los mirrors de Ubuntu, que es
      # infraestructura de terceros y **se cuelga**: el 2026-08-17 se quedó 13
      # minutos en silencio en una sola línea y se comió el job entero.
      #
      # El timeout no lo evita; lo convierte en un fallo de 6 minutos que se
      # relanza, en vez de uno de 30 que hay que ir a cancelar a mano.
      - name: Instalar Chromium
        timeout-minutes: 6
        run: pnpm exec playwright install --with-deps chromium

      # El servidor de E2E levanta su propio MongoDB en memoria y construye los
      # frontends: no hace falta ningún servicio externo.
      - name: E2E
        run: pnpm test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # La imagen de producción, construida de verdad.
  #
  # El Dockerfile existía desde `INF-3` y **nunca se había construido**: no hay
  # Docker en la máquina de desarrollo. Así se le pasó que no copiaba el
  # manifiesto de `@bal/ui`, que nació después — y con un importer en el
  # lockfile sin su directorio, la imagen no construye.
  #
  # Un Dockerfile que nadie construye es un deploy que falla la noche del
  # torneo, que es cuando no hay nadie para arreglarlo.
  imagen:
    name: Imagen de producción
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Construir
        run: docker build -t bal:ci .

      # `SECURITY.md` §13 lo pedía y estaba sin verificar por el mismo motivo:
      # `USER node` declarado en el Dockerfile no prueba nada hasta que alguien
      # corre el contenedor.
      - name: El contenedor NO corre como root
        run: |
          uid=$(docker run --rm --entrypoint id bal:ci -u)
          echo "uid=$uid"
          test "$uid" != "0"

      # Humo mínimo sin base de datos: prueba que el entrypoint existe, que node
      # lo encuentra y que la validación de configuración corre **antes** de
      # abrir el puerto. Un contenedor que levanta con secretos de desarrollo es
      # peor que uno que no levanta.
      - name: Sin configuración, falla ruidosamente
        run: |
          salida=$(docker run --rm -e NODE_ENV=production bal:ci 2>&1 || true)
          echo "$salida"
          echo "$salida" | grep -q 'MONGODB_URI'

  audit:
    name: Auditoría de dependencias
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Vulnerabilidades altas o críticas
        run: pnpm audit --audit-level=high
