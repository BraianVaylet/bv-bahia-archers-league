# Pruebas de mutación nocturnas (`REF6-14` / `T-7`).
#
# Un test que pasa no prueba que el código esté bien: prueba que ese código, tal cual, pasa. La
# mutación cambia el código a propósito (un `<` por un `<=`, un `&&` por un `||`) y mira si algún
# test se entera. Cada mutante que sobrevive es una regla que nadie está vigilando.
#
# Hasta ahora esto se hacía a mano al cierre de cada tarea y se anotaba en la bitácora. Acá es
# sistemático, sobre las dos piezas donde un cambio silencioso más cuesta: el dominio (`@bal/shared`)
# y la sincronización idempotente (`syncService`).
#
# **No corre en cada PR**: tarda minutos en el dominio y bastante más en la sincronización, que
# levanta un MongoDB en memoria por worker. De noche y a demanda. No bloquea ningún merge: avisa.
#
# El umbral `break` de cada `stryker.config.json` hace fallar el job si el puntaje baja de ahí. El
# reporte HTML queda como artefacto para ver qué mutantes sobrevivieron.

name: Mutación

on:
  schedule:
    # 05:00 UTC = 02:00 en Argentina.
    - cron: '0 5 * * *'
  workflow_dispatch:

# Sólo lectura, como el CI (`REF6-14` / `S-10`).
permissions:
  contents: read

env:
  MONGOMS_VERSION: 7.0.14

jobs:
  dominio:
    name: Mutación · @bal/shared
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Mutación del dominio
        run: pnpm --filter @bal/shared mutacion

      - name: Reporte
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mutacion-shared
          path: packages/shared/reports/mutacion
          if-no-files-found: ignore
          retention-days: 14

  sincronizacion:
    name: Mutación · syncService
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Caché del binario de MongoDB
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/mongodb-binaries
          key: mongo-${{ runner.os }}-${{ env.MONGOMS_VERSION }}

      # Una sola descarga antes de que los workers levanten su propio replica set.
      - name: Precargar MongoDB
        run: node scripts/precargar-mongo.mjs

      # Los tests del API importan `@bal/shared` ya compilado.
      - name: Compilar las librerías
        run: pnpm run build:libs

      - name: Mutación de la sincronización
        run: pnpm --filter @bal/api mutacion

      - name: Reporte
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mutacion-sync
          path: packages/api/reports/mutacion
          if-no-files-found: ignore
          retention-days: 14
