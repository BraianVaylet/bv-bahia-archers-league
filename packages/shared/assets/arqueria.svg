<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" role="img" aria-label="Un arquero apuntando a un blanco 3D en el monte">
  <title>Tiro con arco en el monte</title>
  <!--
    Ilustración de portada. **Dibujada acá y no una foto**: la CSP prohíbe
    pedidos externos, y una foto que entre en el presupuesto de la landing
    tendría que comprimirse hasta verse mal. Esto pesa dos kilobytes.

    Sin degradados ni filtros, y con `currentColor` en el arquero para que
    acompañe el tema claro y oscuro. Los tres anillos del blanco son los
    colores de estaca, que es la identidad de la liga.
  -->

  <!-- Suelo. -->
  <path d="M0 150 H320" stroke="currentColor" stroke-width="2" opacity="0.25" />

  <!-- Monte, apenas insinuado. -->
  <path d="M12 150 L26 120 L40 150 Z" fill="currentColor" opacity="0.15" />
  <path d="M266 150 L284 112 L302 150 Z" fill="currentColor" opacity="0.15" />

  <!-- El blanco, a la derecha, sobre su estaca. -->
  <path d="M244 150 V96" stroke="currentColor" stroke-width="3" opacity="0.5" />
  <circle cx="244" cy="80" r="26" fill="#d22b2b" />
  <circle cx="244" cy="80" r="17" fill="#1d5fd6" />
  <circle cx="244" cy="80" r="8" fill="#f5c518" />

  <!-- Arquero: cabeza, torso y piernas en tensión de tiro. -->
  <g stroke="currentColor" stroke-width="5" stroke-linecap="round" fill="none">
    <circle cx="70" cy="52" r="10" fill="currentColor" stroke="none" />
    <path d="M70 63 V104" />
    <path d="M70 104 L56 148" />
    <path d="M70 104 L88 148" />
    <!-- Brazo del arco, extendido hacia el blanco. -->
    <path d="M70 76 H112" />
    <!-- Brazo de cuerda, recogido. -->
    <path d="M70 76 L48 88" />
  </g>

  <!-- El arco y la cuerda tensada. -->
  <path
    d="M118 44 Q136 76 118 108"
    fill="none"
    stroke="currentColor"
    stroke-width="4"
    stroke-linecap="round"
  />
  <path d="M118 44 L104 76 L118 108" fill="none" stroke="currentColor" stroke-width="1.5" />

  <!-- La flecha, ya en línea con el centro del blanco. -->
  <path d="M104 76 H150" stroke="currentColor" stroke-width="3" stroke-linecap="round" />
  <path d="M150 76 L142 72 M150 76 L142 80" stroke="currentColor" stroke-width="3" stroke-linecap="round" />
</svg>
