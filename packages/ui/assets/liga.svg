<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Liga Bahiense de Arquería">
  <title>Liga Bahiense de Arquería</title>
  <!--
    ARTE CANÓNICO DE LA MARCA. Una sola copia.

    `packages/app/public/icon.svg` y `packages/landing/public/favicon.svg` se
    generan de acá con `node scripts/imagenes.mjs`, y el componente `<Logo />`
    de `@bal/ui` dibuja lo mismo. Hay un test que compara los dos: dos copias
    de un logo se separan, y la que se separa es siempre la que nadie mira.

    Un blanco de tres anillos sobre placa oscura, con el verde de acento.
    Colores fijos en los dos temas: una marca que cambia de color no es una
    marca. Sin degradados ni filtros: tiene que verse a 24px en un header y a
    200px en una planilla impresa.
  -->
  <rect width="64" height="64" rx="14" fill="#16170f"/>
  <circle cx="32" cy="32" r="21" fill="none" stroke="#c6f000" stroke-width="6"/>
  <circle cx="32" cy="32" r="12.5" fill="none" stroke="#f4f3ec" stroke-width="6"/>
  <circle cx="32" cy="32" r="4.5" fill="#c6f000"/>
</svg>
