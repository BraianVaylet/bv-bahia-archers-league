<!doctype html>
<html lang="es-AR" data-theme="light">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>WaflBlanco</title><link rel="stylesheet" href="../tokens.css"><link rel="stylesheet" href="../componentes.css"><script>document.documentElement.dataset.theme=/oscuro/.test(location.search)?"dark":"light"</script><style>body{max-width:390px;margin:0 auto;box-shadow:0 0 0 1px var(--line)}</style>
<style>
.pv { padding: 16px; display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }

.thead .num { font-family: var(--font-display); font-stretch: 125%; font-variation-settings: "wdth" 125; font-weight: 800; font-size: 56px; line-height: 1; }
.thead .meta { display: flex; flex-direction: column; gap: 6px; }
